<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AniBrowse</title>
<style>
  :root{
    --bg:#0b0d12;
    --bg2:#12151c;
    --card:#171b24;
    --card-hi:#1e2330;
    --line:#262c3a;
    --text:#eef0f4;
    --sub:#8b93a7;
    --accent:#ff7a3d;   /* theme-driven primary — changed at runtime by applyTheme() */
    --pink:#ff5da2;      /* semantic: "like" — constant across themes */
    --teal:#2fd1c5;
    --blue:#5b9dff;      /* semantic: "watchlist" — constant across themes */
    --purple:#b083ff;
    --yellow:#ffd23f;
    --green:#5fe089;     /* semantic: "connected" — constant across themes */
    --red:#ff5c6c;       /* semantic: "dislike" — constant across themes */
  }
  *{box-sizing:border-box;}
  button, input, textarea{ font-family:inherit; color:var(--text); }
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:900px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; background:var(--bg); }
  @media (min-width:860px){
    #app{
      max-width:1200px; display:grid;
      grid-template-columns:104px 1fr; grid-template-rows:auto 1fr;
      grid-template-areas:"header header" "nav main";
    }
    #app > header{ grid-area:header; }
    #app > main{ grid-area:main; overflow-y:auto; }
    #app > nav.tabs{
      grid-area:nav; grid-template-columns:1fr; grid-auto-rows:min-content; align-content:flex-start;
      border-top:none; border-right:1px solid var(--line); padding-top:18px; gap:6px; padding-bottom:0;
    }
    nav.tabs button{ padding:14px 4px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); }
    .chips{ grid-template-columns:repeat(4,1fr); }
    .modal-wrap{ align-items:center; }
    .modal{ max-width:640px; max-height:88dvh; }
  }
  @media (min-width:1200px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(165px,1fr)); }
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--line); flex-shrink:0; gap:8px;
  }
  .logo{ display:flex; align-items:center; gap:9px; font-weight:900; font-size:19px; letter-spacing:-0.5px; }
  .logo-badge{
    width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.18), rgba(0,0,0,0) 60%), var(--bg2);
    box-shadow:0 0 14px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 0 0 1px var(--line);
  }
  .logo-badge svg{ width:14px; height:14px; margin-left:2px; }
  .logo span.g{
    background:linear-gradient(90deg,var(--accent),var(--pink),var(--purple),var(--blue),var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    background-size:200% auto; animation:hue 6s linear infinite;
  }
  @keyframes hue{ to{ background-position:200% center; } }
  .reduce-motion .logo span.g{ animation:none; }
  .reduce-motion .card{ transition:none; }
  .reduce-motion .card:hover{ transform:none; }
  .reduce-motion .chip:active, .reduce-motion .genretile:active{ transform:none; }
  .acct{ display:flex; gap:6px; align-items:center; font-size:11px; color:var(--sub); }
  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px;
    font-weight:700; font-size:11px; border:1px solid var(--line); background:var(--card); cursor:pointer;
    color:var(--text);
  }
  .pill.on{ border-color:var(--green); color:var(--green); }
  main{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .logo-text{ white-space:nowrap; }
  nav.tabs{
    display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line);
    flex-shrink:0; padding-bottom:env(safe-area-inset-bottom); background:var(--bg2);
  }
  nav.tabs button{
    background:none; border:none; color:var(--sub); display:flex; flex-direction:column;
    align-items:center; gap:clamp(2px,0.6vw,4px); padding:clamp(8px,2vw,14px) 2px clamp(6px,1.6vw,10px);
    font-size:clamp(9px,2.3vw,13px); font-weight:800; cursor:pointer;
  }
  nav.tabs button.active{ color:var(--accent); }
  nav.tabs button svg{ width:clamp(16px,4.2vw,24px); height:clamp(16px,4.2vw,24px); }
  /* themed scrollbars instead of the browser default */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--accent); }
  *{ scrollbar-width:thin; scrollbar-color:var(--line) var(--bg); }
  .section-title{ display:flex; align-items:center; gap:8px; margin:14px 16px 10px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; color:var(--sub);}
  .chips{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:0 16px 16px; }
  .chip{
    padding:8px 14px; border-radius:10px; font-weight:800; font-size:12.5px; color:#0a0a0a; cursor:pointer;
    border:none; box-shadow:0 2px 0 rgba(0,0,0,.25); transition:transform .1s;
  }
  .chip:active{ transform:scale(.95); }
  .genretile{
    position:relative; aspect-ratio:16/10; border-radius:16px; border:none; cursor:pointer; overflow:hidden;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; padding:12px;
    color:#fff; text-align:left; transition:transform .12s;
  }
  .genretile:active{ transform:scale(.96); }
  .genretile .emoji{ position:absolute; top:8px; right:10px; font-size:28px; opacity:.7; }
  .genretile .gname{ font-weight:900; font-size:14.5px; text-shadow:0 1px 6px rgba(0,0,0,.4); position:relative; z-index:1; }
  .grid{
    display:grid; gap:12px; padding:0 16px 24px;
    grid-template-columns:repeat(auto-fill, minmax(var(--grid-min, clamp(120px,26vw,160px)), 1fr));
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer;
    transition:transform .15s, border-color .15s; position:relative;
  }
  .card:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .card .thumb{ position:relative; width:100%; aspect-ratio:2/3; background:#222; overflow:hidden; }
  .card .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .badge{ position:absolute; font-size:10px; font-weight:800; padding:3px 6px; border-radius:6px; background:rgba(0,0,0,.65); }
  .badge.score{ top:6px; right:6px; color:var(--green); }
  .badge.wl{ top:6px; left:6px; color:var(--blue); }
  .badge.like{ bottom:6px; left:6px; color:var(--pink); }
  .card .title{ padding:8px 9px; font-size:12px; font-weight:700; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .backbar{ display:flex; align-items:center; gap:10px; padding:12px 16px; }
  .iconbtn{ background:var(--card); border:1px solid var(--line); border-radius:10px; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); }
  .sentinel{ display:flex; justify-content:center; padding:20px; color:var(--sub); font-size:12px; }
  .spin{ animation:spin 1s linear infinite; width:20px; height:20px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .err{ margin:16px; padding:12px; border:1px solid var(--red); border-radius:10px; color:var(--red); font-size:13px; }
  .modal-wrap{ position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:640px){ .modal-wrap{ align-items:center; } }
  .modal{ width:100%; max-width:560px; max-height:92dvh; overflow-y:auto; background:var(--bg2);
    border:1px solid var(--line); border-radius:18px 18px 0 0; position:relative; }
  @media (min-width:640px){ .modal{ border-radius:18px; } }
  .modal .close{ position:absolute; top:10px; right:10px; z-index:2; background:rgba(0,0,0,.6); border:none;
    color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer; }
  .video-wrap{ position:relative; width:100%; aspect-ratio:16/9; background:var(--bg2); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .video-wrap img.bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(18px) brightness(.6); transform:scale(1.15); z-index:0; }
  .video-wrap .playbtn, .video-wrap span{ position:relative; z-index:1; }
  .video-wrap iframe{ position:relative; width:100%; height:100%; border:none; }
  .playbtn{ position:relative; display:flex; align-items:center; gap:8px; padding:10px 18px; border-radius:999px;
    background:var(--accent); color:#0a0a0a; font-weight:800; border:none; cursor:pointer; }
  .modal-body{ padding:18px; }
  .modal-body h2{ margin:0 0 8px; font-size:18px; }
  .genretags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .genretag{ font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px; color:#0a0a0a; }
  .meta{ display:flex; gap:14px; font-size:11.5px; color:var(--sub); font-weight:700; margin-bottom:10px; }
  .synopsis{ font-size:13.5px; line-height:1.6; color:#cfd3dd; white-space:pre-line; margin-bottom:14px; }
  .extlink{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--blue); text-decoration:none; margin-bottom:16px; }
  .actionrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border-top:1px solid var(--line); padding-top:14px; }
  .actionbtn{ display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 0; border-radius:12px;
    border:1px solid var(--line); background:var(--card); cursor:pointer; color:var(--sub); font-weight:800; font-size:10.5px; }
  .actionbtn.dislike.on{ border-color:var(--red); color:var(--red); background:rgba(255,92,108,.12); }
  .actionbtn.wl.on{ border-color:var(--blue); color:var(--blue); background:rgba(91,157,255,.12); }
  .actionbtn.like.on{ border-color:var(--pink); color:var(--pink); background:rgba(255,93,162,.12); }
  .swipe-stage{ position:relative; flex:1; min-height:0; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .swipe-stage img.bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.28; filter:blur(2px); z-index:0; }
  .swipe-stage iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; z-index:1; opacity:1; background:#000; }
  .swipe-title{ position:absolute; top:10px; left:10px; right:56px; background:rgba(0,0,0,.6); padding:6px 10px; border-radius:8px; font-weight:800; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:2; pointer-events:none; }
  .swipe-actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px 14px; border-top:1px solid var(--line); flex-shrink:0; }
  .settings{ padding:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; font-weight:800; color:var(--sub); margin-bottom:5px; }
  .field input{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13px; }
  .field small{ display:block; color:var(--sub); margin-top:4px; font-size:11px; line-height:1.5; }
  .btn{ padding:10px 16px; border-radius:10px; border:none; font-weight:800; font-size:13px; cursor:pointer; }
  .btn.primary{ background:var(--accent); color:#0a0a0a; }
  .btn.ghost{ background:var(--card); color:var(--text); border:1px solid var(--line); }
  .card-box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .divider{ height:1px; background:var(--line); margin:18px 0; }
  .empty{ text-align:center; color:var(--sub); font-size:13px; padding:40px 20px; }
  .mytabs{ display:flex; gap:8px; padding:14px 16px 4px; flex-wrap:wrap; }
  .mytab{ padding:7px 12px; border-radius:999px; font-weight:800; font-size:11.5px; border:1px solid var(--line); background:none; cursor:pointer; }
  .mode-toggle{ display:flex; gap:8px; margin-bottom:16px; }
  .modebtn{ flex:1; padding:9px 0; border-radius:10px; border:1px solid var(--line); background:var(--bg2); color:var(--sub); font-weight:800; font-size:12.5px; cursor:pointer; }
  .modebtn.on{ border-color:var(--accent); color:var(--text); background:color-mix(in srgb, var(--accent) 16%, var(--bg2)); }
  .theme-label{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--sub); margin:12px 0 8px; }
  .swatches{ display:flex; flex-wrap:wrap; gap:10px; }
  .swatch{ width:34px; height:34px; border-radius:50%; border:2px solid transparent; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2); }
  .swatch.on{ border-color:var(--text); transform:scale(1.08); }
  .customswatch-wrap{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  input.customswatch{ -webkit-appearance:none; appearance:none; width:34px; height:34px; border-radius:50%; border:2px solid var(--line); padding:0; cursor:pointer; background:none; }
  input.customswatch::-webkit-color-swatch-wrapper{ padding:0; border-radius:50%; }
  input.customswatch::-webkit-color-swatch{ border:none; border-radius:50%; }
  .customswatch-label{ font-size:9.5px; font-weight:800; color:var(--sub); }
  .settings-toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:pointer; }
  input.togglecheck{ -webkit-appearance:none; appearance:none; width:42px; height:24px; border-radius:999px; background:var(--bg2);
    border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0; }
  input.togglecheck::before{ content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:var(--sub); transition:transform .15s, background .15s; }
  input.togglecheck:checked{ background:color-mix(in srgb, var(--accent) 35%, var(--bg2)); border-color:var(--accent); }
  input.togglecheck:checked::before{ background:var(--accent); transform:translateX(18px); }

  /* Material 3 Expressive: bold, varied, generous corner radii; pill-shaped controls */
  .theme-expressive .card{ border-radius:26px; }
  .theme-expressive .thumb{ border-radius:22px 22px 0 0; }
  .theme-expressive .modal{ border-radius:30px 30px 0 0; }
  .theme-expressive .card-box, .theme-expressive .review-item, .theme-expressive .season-row{ border-radius:22px; }
  .theme-expressive .btn, .theme-expressive .playbtn, .theme-expressive .chip, .theme-expressive .genretag,
  .theme-expressive .status-chip, .theme-expressive .mytab, .theme-expressive .studio-chip{ border-radius:999px; }
  .theme-expressive .searchbar{ border-radius:999px; }

  /* Fluent 2: translucent "Acrylic" layered surfaces, tighter corners, subtle blur depth */
  .theme-fluent .card, .theme-fluent .modal, .theme-fluent .searchbar, .theme-fluent .review-item,
  .theme-fluent .card-box, .theme-fluent .season-row, .theme-fluent .status-chip, .theme-fluent .mytab{
    backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
  }
  .theme-fluent .card{ border-radius:8px; }
  .theme-fluent .thumb{ border-radius:7px 7px 0 0; }
  .theme-fluent .modal{ border-radius:12px 12px 0 0; }

  /* search */
  .searchbar{ display:flex; align-items:center; gap:8px; margin:12px 16px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px; }
  .searchbar svg{ width:16px; height:16px; color:var(--sub); flex-shrink:0; }
  .searchbar input{ flex:1; background:none; border:none; outline:none; color:var(--text); font-size:14px; }
  .searchbar input::placeholder{ color:var(--sub); }
  .searchbar .clearbtn{ background:none; border:none; color:var(--sub); cursor:pointer; font-size:14px; padding:2px 4px; }

  /* modal back / stack */
  .modal .backbtn2{ position:absolute; top:10px; left:10px; z-index:2; background:rgba(0,0,0,.6); border:none;
    color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer; }

  /* list status editor */
  .list-block{ border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .list-heading{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--sub); margin-bottom:9px; }
  .status-row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  .status-chip{ padding:7px 12px; border-radius:999px; font-size:11.5px; font-weight:800; border:1px solid var(--line); background:var(--bg2); color:var(--sub); cursor:pointer; }
  .status-chip.on{ color:#0a0a0a; border-color:transparent; }
  .progress-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .stepper{ display:flex; align-items:center; gap:10px; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:4px 6px; }
  .stepper button{ width:26px; height:26px; border-radius:8px; border:none; background:var(--card-hi); color:var(--text); font-weight:900; cursor:pointer; }
  .stepper .val{ min-width:44px; text-align:center; font-weight:800; font-size:13px; }
  .score-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .score-row input[type=number]{ width:70px; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:var(--bg2); color:var(--text); font-size:13px; }
  .score-stars{ display:flex; gap:4px; }
  .score-stars button{ background:none; border:none; font-size:20px; cursor:pointer; opacity:.35; color:var(--sub); }
  .score-stars button.on{ color:var(--yellow); opacity:1; }
  .score-smiley button{ background:var(--bg2); border:1px solid var(--line); border-radius:999px; padding:6px 12px;
    font-size:11.5px; font-weight:800; cursor:pointer; color:var(--sub); }
  .score-smiley button.on{ color:#0a0a0a; border-color:transparent; background:var(--accent); }
  .removebtn{ font-size:11.5px; color:var(--red); background:none; border:none; cursor:pointer; font-weight:700; padding:0; }

  /* cast / staff */
  .people-scroll{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .person-card{ flex-shrink:0; width:84px; text-align:center; cursor:pointer; }
  .person-card img{ width:84px; height:84px; object-fit:cover; border-radius:12px; background:var(--card-hi); margin-bottom:5px; }
  .person-card .pname{ font-size:10.5px; font-weight:700; line-height:1.25; }
  .person-card .prole{ font-size:9.5px; color:var(--sub); margin-top:1px; }

  /* studios */
  .studio-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .studio-chip{ padding:6px 12px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--bg2); border:1px solid var(--line); color:var(--text); cursor:pointer; }

  /* reviews */
  .review-item{ background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .review-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; }
  .review-user{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; }
  .review-user img{ width:20px; height:20px; border-radius:50%; object-fit:cover; }
  .review-score{ font-size:11.5px; font-weight:800; color:var(--green); }
  .review-summary{ font-size:12.5px; color:var(--sub); line-height:1.5; }
  .review-form input[type=text]{ width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:var(--bg2); color:var(--text); font-size:13px; margin-bottom:8px; }
  .review-form textarea{ width:100%; min-height:120px; padding:10px 11px; border-radius:8px; border:1px solid var(--line); background:var(--bg2); color:var(--text); font-size:13px; font-family:inherit; resize:vertical; margin-bottom:6px; }
  .review-form .charcount{ font-size:11px; color:var(--sub); margin-bottom:8px; }
  .review-form .charcount.bad{ color:var(--red); }

  /* studio / person hero pages */
  .hero{ padding:20px 16px 10px; display:flex; gap:14px; align-items:center; }
  .hero img{ width:84px; height:84px; border-radius:16px; object-fit:cover; background:var(--card-hi); }
  .hero h2{ margin:0 0 4px; font-size:17px; }
  .hero .sub{ font-size:12px; color:var(--sub); font-weight:700; }
  .formattag{ font-size:9.5px; font-weight:800; color:var(--sub); padding:0 9px 9px; letter-spacing:.2px; }
  .season-row{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:var(--bg2); color:var(--text);
    border:1px solid var(--line); border-radius:12px; padding:8px; margin-bottom:8px; cursor:pointer; }
  .season-row img{ width:46px; height:65px; object-fit:cover; border-radius:8px; background:var(--card-hi); flex-shrink:0; }
  .season-info{ flex:1; min-width:0; }
  .season-title{ font-size:12.5px; font-weight:800; }
  .season-sub{ font-size:11px; color:var(--sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  a{ color:inherit; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <span class="logo-badge"><svg viewBox="0 0 24 24" fill="var(--accent)"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
      <span class="logo-text">Ani<span class="g">browse</span></span>
    </div>
    <div class="acct" id="acctBar"></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Browse</button>
    <button data-tab="swipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>Discover</button>
    <button data-tab="mylist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>My List</button>
    <button data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/><circle cx="12" cy="12" r="3.2"/></svg>Match Me</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.7.36 1.51.63 1.51 1z"/></svg>Settings</button>
  </nav>
</div>

<script>
/* ============================== CONFIG / STORAGE ============================== */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); },
};
const REDIRECT_URI = location.origin + location.pathname;
const PALETTE = ['#ff7a3d','#ff5da2','#2fd1c5','#5b9dff','#b083ff','#ffd23f','#5fe089','#ff5c6c','#4dd0e1','#ffb86b'];
const colorFor = s => PALETTE[Math.abs([...s].reduce((a,c)=>a+c.charCodeAt(0),0)) % PALETTE.length];

/* ============================== THEME ENGINE ============================== */
const NEUTRAL_DARK  = { bg:'#0b0d12', bg2:'#12151c', card:'#171b24', cardHi:'#1e2330', line:'#262c3a', text:'#eef0f4', sub:'#8b93a7' };
const NEUTRAL_LIGHT = { bg:'#f4f5f8', bg2:'#ffffff', card:'#ffffff', cardHi:'#eef0f5', line:'#dfe2e8', text:'#181b22', sub:'#5c6273' };

const ACCENTS = {
  red:'#ff5c6c', orange:'#ff7a3d', yellow:'#ffd23f', green:'#5fe089', teal:'#2fd1c5',
  cyan:'#4dd0e1', blue:'#5b9dff', indigo:'#7c83ff', purple:'#b083ff', pink:'#ff5da2',
  crimson:'#e63950', amber:'#ffb100', lime:'#a6e22e', emerald:'#12b886', sky:'#38bdf8',
  cobalt:'#2f5fff', violet:'#8b5cf6', magenta:'#e935c1', rose:'#fb7185', slate:'#94a3b8',
};
const PASTELS = {
  'pastel-pink':'#ffb3c6', 'pastel-blue':'#a8d8ff', 'pastel-green':'#b8f2c9',
  'pastel-purple':'#d4b3ff', 'pastel-yellow':'#fff3b0',
};
// Official Catppuccin palettes (base/mantle/surface/text/mauve), each is a fully self-contained theme.
const CATPPUCCIN = {
  'catppuccin-latte':     { bg:'#eff1f5', bg2:'#e6e9ef', card:'#e6e9ef', cardHi:'#ccd0da', line:'#ccd0da', text:'#4c4f69', sub:'#6c6f85', accent:'#8839ef' },
  'catppuccin-frappe':    { bg:'#303446', bg2:'#292c3c', card:'#292c3c', cardHi:'#414559', line:'#414559', text:'#c6d0f5', sub:'#949cbb', accent:'#ca9ee6' },
  'catppuccin-macchiato': { bg:'#24273a', bg2:'#1e2030', card:'#1e2030', cardHi:'#363a4f', line:'#363a4f', text:'#cad3f5', sub:'#939ab7', accent:'#c6a0f6' },
  'catppuccin-mocha':     { bg:'#1e1e2e', bg2:'#181825', card:'#181825', cardHi:'#313244', line:'#313244', text:'#cdd6f4', sub:'#9399b2', accent:'#cba6f7' },
};
const CATPPUCCIN_LABELS = { 'catppuccin-latte':'Latte', 'catppuccin-frappe':'Frappé', 'catppuccin-macchiato':'Macchiato', 'catppuccin-mocha':'Mocha' };
// Two fully custom, user-colorable themes styled after real design languages:
// - "custom-expressive": Google's Material 3 Expressive (bold varied shapes, big tonal surfaces derived from one seed color)
// - "custom-fluent": Microsoft's Fluent 2 (translucent "Acrylic" layered surfaces, tighter corners, subtle depth)
// Both read their accent from a per-theme color the person picks, stored separately from the theme selector itself.
function customColorFor(family){
  return LS.get(family === 'custom-expressive' ? 'custom_expressive_color' : 'custom_fluent_color',
    family === 'custom-expressive' ? '#7c5cff' : '#3b82f6');
}
function themeVars(theme){
  if (CATPPUCCIN[theme.family]) return CATPPUCCIN[theme.family];
  const base = theme.mode === 'light' ? NEUTRAL_LIGHT : NEUTRAL_DARK;
  if (theme.family === 'custom-expressive') {
    const accent = theme.customColor || customColorFor('custom-expressive');
    // MD3-style dynamic color: tint every surface tone toward the seed color instead of using flat neutrals.
    const mix = (basePct) => `color-mix(in srgb, ${base.bg2} ${basePct}%, ${accent})`;
    return {
      bg: `color-mix(in srgb, ${base.bg} 92%, ${accent})`,
      bg2: mix(88), card: mix(80), cardHi: mix(70),
      line: `color-mix(in srgb, ${base.line} 65%, ${accent})`,
      text: base.text, sub: base.sub, accent,
    };
  }
  if (theme.family === 'custom-fluent') {
    const accent = theme.customColor || customColorFor('custom-fluent');
    const light = theme.mode === 'light';
    return {
      bg: base.bg,
      bg2: light ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.055)',
      card: light ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.045)',
      cardHi: light ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.09)',
      line: light ? 'rgba(0,0,0,0.09)' : 'rgba(255,255,255,0.13)',
      text: base.text, sub: base.sub, accent,
    };
  }
  const accent = ACCENTS[theme.family] || PASTELS[theme.family] || ACCENTS.orange;
  return { ...base, accent };
}
function applyGridDensity(density){
  document.documentElement.style.setProperty('--grid-min', density === 'compact' ? '95px' : 'clamp(120px,26vw,160px)');
}
function applyReduceMotion(on){
  document.documentElement.classList.toggle('reduce-motion', !!on);
}
function applyTheme(theme){
  const v = themeVars(theme);
  const root = document.documentElement.style;
  root.setProperty('--bg', v.bg);
  root.setProperty('--bg2', v.bg2);
  root.setProperty('--card', v.card);
  root.setProperty('--card-hi', v.cardHi);
  root.setProperty('--line', v.line);
  root.setProperty('--text', v.text);
  root.setProperty('--sub', v.sub);
  root.setProperty('--accent', v.accent);
  document.documentElement.classList.toggle('theme-expressive', theme.family === 'custom-expressive');
  document.documentElement.classList.toggle('theme-fluent', theme.family === 'custom-fluent');
  state.theme = theme;
  LS.set('theme', theme);
}

let state = {
  settings: LS.get('app_settings', {
    autoplayTrailer: false, gridDensity: 'comfortable', showScores: true, openTrailerNewTab: false,
    reduceMotion: false, defaultDiscoverMode: 'random', hideMoviesInBrowse: false,
    minScoreFilter: 0, autoCompleteOnLastEp: true, defaultMyListTab: 'CURRENT',
  }),
  tab: 'browse',
  genres: [],
  genresError: null,
  anilist: LS.get('al_auth', null),   // {token, user:{id,name,avatar}, scoreFormat}
  local: LS.get('local_prefs', { liked: [] }), // local-only likes, keyed by anilist id
  browse: { mode: 'pick', genre: null, search: '', items: [], page: 1, hasNext: true, loading: false, error: null },
  swipe:  { genre: null, mode: LS.get('app_settings',{}).defaultDiscoverMode || 'random', queue: [], idx: 0, page: 1, playing: false, loading: false, error: null, seenPages: new Set() },
  mylist: { tab: LS.get('app_settings',{}).defaultMyListTab || 'CURRENT', byStatus: { CURRENT:[], PLANNING:[], COMPLETED:[], PAUSED:[], DROPPED:[], REPEATING:[] }, loading: false, error: null },
  modalStack: [], // [{type:'anime'|'studio'|'person', data, detail, entry, loading}]
  quiz: { step:0, answers:{}, done:false, loading:false, results:[] },
  theme: LS.get('theme', { family: 'orange', mode: 'dark' }),
};
applyTheme(state.theme);
applyGridDensity(state.settings.gridDensity);
applyReduceMotion(state.settings.reduceMotion);
function curModal(){ return state.modalStack[state.modalStack.length-1] || null; }

function persistPrefs(){ LS.set('local_prefs', state.local); }
function saveSettings(){ LS.set('app_settings', state.settings); }

/* ============================== ANILIST ============================== */
const AL_GQL = 'https://graphql.anilist.co';
async function alQuery(query, variables, auth){
  const headers = { 'Content-Type':'application/json', 'Accept':'application/json' };
  if (auth && state.anilist?.token) headers['Authorization'] = 'Bearer ' + state.anilist.token;
  const res = await fetch(AL_GQL, { method:'POST', headers, body: JSON.stringify({query, variables}) });
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0]?.message || 'AniList error');
  return json.data;
}
const MEDIA_FIELDS = `
  id idMal
  title{ romaji english }
  coverImage{ large color }
  averageScore episodes status season seasonYear startDate{ year month day } genres description format
  trailer{ id site thumbnail }
  relations{ edges{ relationType node{ id format } } }
`;
const SEASON_WALK_QUERY = `query($id:Int){
  Media(id:$id){
    id
    relations{ edges{ relationType node{ id title{ romaji english } coverImage{ large color } episodes seasonYear startDate{ year month day } format averageScore } } }
  }
}`;
const MEDIA_QUERY = `query($page:Int,$perPage:Int,$genre:String){
  Page(page:$page, perPage:$perPage){
    pageInfo{ hasNextPage }
    media(genre:$genre, sort:POPULARITY_DESC, type:ANIME, isAdult:false){ ${MEDIA_FIELDS} }
  }
}`;
const MEDIA_SEARCH_QUERY = `query($page:Int,$perPage:Int,$search:String){
  Page(page:$page, perPage:$perPage){
    pageInfo{ hasNextPage }
    media(search:$search, sort:SEARCH_MATCH, type:ANIME, isAdult:false){ ${MEDIA_FIELDS} }
  }
}`;
const MEDIA_DETAIL_QUERY = `query($id:Int){
  Media(id:$id){
    ${MEDIA_FIELDS}
    siteUrl
    studios{ edges{ isMain node{ id name } } }
    characters(sort:[ROLE,RELEVANCE], perPage:25){
      edges{
        role
        node{ id name{ full } image{ medium } }
        voiceActors(language:JAPANESE){ id name{ full } image{ medium } }
      }
    }
    staff(sort:[RELEVANCE], perPage:25){
      edges{ role node{ id name{ full } image{ medium } } }
    }
    reviews(sort:RATING_DESC, perPage:25){
      nodes{ id summary rating ratingAmount score user{ id name avatar{ medium } } }
    }
  }
}`;
const STUDIO_QUERY = `query($id:Int){
  Studio(id:$id){
    id name isAnimationStudio
    media(sort:POPULARITY_DESC, perPage:24){ nodes{ ${MEDIA_FIELDS} } }
  }
}`;
const STAFF_QUERY = `query($id:Int){
  Staff(id:$id){
    id name{ full } image{ large } primaryOccupations
    staffMedia(sort:POPULARITY_DESC, perPage:12){ edges{ node{ ${MEDIA_FIELDS} } } }
  }
}`;
function alAuthUrl(clientId){
  return `https://anilist.co/api/v2/oauth/authorize?client_id=${encodeURIComponent(clientId)}&response_type=token`;
}
async function alFetchViewer(){
  const data = await alQuery(`query{ Viewer{ id name avatar{ medium } mediaListOptions{ scoreFormat } } }`, {}, true);
  return data.Viewer;
}
async function alFetchEntry(mediaId){
  if (!state.anilist?.user) return null;
  const data = await alQuery(`query($id:Int,$uid:Int){ MediaList(mediaId:$id, userId:$uid){ id status progress score } }`, { id: mediaId, uid: state.anilist.user.id }, true);
  return data.MediaList || null;
}
async function alSaveEntry(mediaId, { status, progress, score }){
  const data = await alQuery(`mutation($mediaId:Int,$status:MediaListStatus,$progress:Int,$score:Float){
    SaveMediaListEntry(mediaId:$mediaId, status:$status, progress:$progress, score:$score){ id status progress score }
  }`, { mediaId, status, progress, score }, true);
  return data.SaveMediaListEntry;
}
async function alDeleteEntry(entryId){
  await alQuery(`mutation($id:Int){ DeleteMediaListEntry(id:$id){ deleted } }`, { id: entryId }, true);
}
async function alSaveReview(mediaId, { summary, body, score }){
  const data = await alQuery(`mutation($mediaId:Int,$summary:String,$body:String,$score:Int){
    SaveReview(mediaId:$mediaId, summary:$summary, body:$body, score:$score){ id summary score siteUrl }
  }`, { mediaId, summary, body, score }, true);
  return data.SaveReview;
}
async function alToggleFavourite(mediaId){
  await alQuery(`mutation($id:Int){ ToggleFavourite(animeId:$id){ anime{ nodes{ id } } } }`, { id: mediaId }, true);
}
async function alFetchAllLists(userId){
  const data = await alQuery(`query($uid:Int){
    MediaListCollection(userId:$uid, type:ANIME){
      lists{ status entries{ status progress score media{ ${MEDIA_FIELDS} } } }
    }
  }`, { uid: userId }, true);
  const out = { CURRENT:[], PLANNING:[], COMPLETED:[], PAUSED:[], DROPPED:[], REPEATING:[] };
  (data.MediaListCollection?.lists || []).forEach(l => l.entries.forEach(e => {
    if (!out[e.status]) out[e.status] = [];
    out[e.status].push({ ...e.media, _entry: { status: e.status, progress: e.progress, score: e.score } });
  }));
  return out;
}
async function alFetchDetail(id){
  const data = await alQuery(MEDIA_DETAIL_QUERY, { id });
  return data.Media;
}
async function alFetchStudio(id){
  const data = await alQuery(STUDIO_QUERY, { id });
  return data.Studio;
}
async function alFetchStaff(id){
  const data = await alQuery(STAFF_QUERY, { id });
  return data.Staff;
}

/* ============================== HANDLE OAUTH REDIRECTS ============================== */
(function handleRedirects(){
  if (location.hash.includes('access_token')) {
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get('access_token');
    if (token) {
      state.anilist = { token, user:null };
      LS.set('al_auth', state.anilist);
      history.replaceState(null, '', location.pathname + location.search);
      alFetchViewer().then(u => { state.anilist.user = u; state.anilist.scoreFormat = u.mediaListOptions?.scoreFormat || 'POINT_10'; LS.set('al_auth', state.anilist); renderAcctBar(); }).catch(()=>{});
    }
  }
})();

/* ============================== HELPERS ============================== */
function titleOf(m){ return m.title?.english || m.title?.romaji || 'Untitled'; }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatDate(sd){
  if (!sd || !sd.year) return '';
  if (sd.month && sd.day) return `${MONTHS[sd.month-1]} ${sd.day}, ${sd.year}`;
  if (sd.month) return `${MONTHS[sd.month-1]} ${sd.year}`;
  return String(sd.year);
}
function trailerEmbed(t){
  if (!t) return null;
  if (t.site === 'youtube') return `https://www.youtube.com/embed/${t.id}?autoplay=1&rel=0&playsinline=1&cc_load_policy=1&cc_lang_pref=en&hl=en`;
  if (t.site === 'dailymotion') return `https://www.dailymotion.com/embed/video/${t.id}?autoplay=1`;
  return null;
}
function trailerWatch(t){
  if (!t) return null;
  if (t.site === 'youtube') return `https://www.youtube.com/watch?v=${t.id}`;
  if (t.site === 'dailymotion') return `https://www.dailymotion.com/video/${t.id}`;
  return null;
}
function stripHtml(html){
  if (!html) return 'No synopsis available.';
  return html.replace(/<br\s*\/?>/gi,'\n').replace(/<\/?(i|b|em|strong)>/gi,'').replace(/<[^>]*>/g,'').trim();
}
function isLiked(id){ return state.local.liked.includes(id); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================== RENDER: ACCOUNT BAR ============================== */
function renderAcctBar(){
  const el = document.getElementById('acctBar');
  const alOn = !!state.anilist;
  el.innerHTML = `
    <span class="pill ${alOn?'on':''}">${alOn ? ('AniList: ' + esc(state.anilist.user?.name || '…')) : 'AniList: off'}</span>
  `;
}

/* ============================== RENDER ROOT ============================== */
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  renderAcctBar();
  const view = document.getElementById('view');
  if (state.genresError) {
    view.innerHTML = `<div class="err">${esc(state.genresError)}</div>`;
  } else if (!state.genres.length) {
    view.innerHTML = spinnerHtml();
  } else if (state.tab === 'browse') {
    view.innerHTML = renderBrowse();
  } else if (state.tab === 'swipe') {
    view.innerHTML = renderSwipe();
  } else if (state.tab === 'mylist') {
    view.innerHTML = renderMyList(); loadMyList();
  } else if (state.tab === 'quiz') {
    view.innerHTML = renderQuiz();
  } else if (state.tab === 'settings') {
    view.innerHTML = renderSettings();
  }
  syncModal();
  bindDynamic();
}
function syncModal(){
  const host = document.getElementById('modalHost');
  if (curModal()) {
    renderModal();
  } else if (host) {
    host.innerHTML = '';
  }
}
function spinnerHtml(){
  return `<div style="display:flex;align-items:center;justify-content:center;height:60vh;">
    <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="#8b93a7" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="42" stroke-dashoffset="14"/></svg>
  </div>`;
}
function chipsHtml(title, action){
  return `<div class="section-title">${title}</div>
  <div class="chips">${state.genres.map(g => `
    <button class="genretile" style="background:linear-gradient(155deg, ${colorFor(g)}, color-mix(in srgb, ${colorFor(g)} 55%, black))" data-action="${action}" data-genre="${esc(g)}">
      <span class="gname">${esc(g)}</span>
    </button>
  `).join('')}</div>`;
}
const STATUS_LABELS = { CURRENT:'Watching', PLANNING:'Planning', COMPLETED:'Completed', PAUSED:'Paused', DROPPED:'Dropped', REPEATING:'Repeating' };
const STATUS_COLORS = { CURRENT:'#5fe089', PLANNING:'#5b9dff', COMPLETED:'#b083ff', PAUSED:'#ffd23f', DROPPED:'#ff5c6c', REPEATING:'#2fd1c5' };
function statusOf(id){
  for (const k in state.mylist.byStatus) { if (state.mylist.byStatus[k].some(x=>x.id===id)) return k; }
  return null;
}
const FORMAT_TAGS = { MOVIE:'Movie', OVA:'OVA', ONA:'ONA', SPECIAL:'Special', TV_SHORT:'TV Short', MUSIC:'Music' };
function cardHtml(m){
  const st = statusOf(m.id);
  const tag = FORMAT_TAGS[m.format];
  return `<div class="card" data-action="openMedia" data-mediajson='${esc(JSON.stringify(m))}'>
    <div class="thumb" style="background:${m.coverImage?.color||'#222'}">
      <img src="${m.coverImage?.large||''}" loading="lazy" alt="">
      ${(m.averageScore && state.settings.showScores) ? `<span class="badge score">${m.averageScore}%</span>` : ''}
      ${st ? `<span class="badge wl" style="color:${STATUS_COLORS[st]}">${STATUS_LABELS[st]}</span>` : ''}
      ${isLiked(m.id) ? `<span class="badge like"><svg viewBox="0 0 24 24" fill="currentColor" style="width:11px;height:11px;"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>` : ''}
    </div>
    <div class="title">${esc(titleOf(m))}</div>
    ${tag ? `<div class="formattag">${tag}</div>` : ''}
  </div>`;
}
function seriesCardHtml(m, seasonCount, movieCount){
  let label = `${seasonCount} season${seasonCount>1?'s':''}`;
  if (movieCount>0) label += ` · ${movieCount} movie${movieCount>1?'s':''}`;
  return `<div class="card" data-action="openSeries" data-series-id="${m.id}" data-mediajson='${esc(JSON.stringify(m))}'>
    <div class="thumb" style="background:${m.coverImage?.color||'#222'}">
      <img src="${m.coverImage?.large||''}" loading="lazy" alt="">
      ${(m.averageScore && state.settings.showScores) ? `<span class="badge score">${m.averageScore}%</span>` : ''}
    </div>
    <div class="title">${esc(titleOf(m))}</div>
    <div class="formattag" style="color:var(--accent);">${label}</div>
  </div>`;
}
// For discovery grids (Browse / Studio / Person pages): collapse a TV show's sequel seasons
// into the first season's card, which opens a unified "series" page listing every season.
// Movies are never collapsed as their own cards — they're just tagged — but they DO count
// toward the franchise's label on its series card (e.g. "3 seasons · 1 movie").
// Note: AniList doesn't always tag season-2+ as relationType SEQUEL — spin-off-titled
// continuations (like Horimiya -piece-) are often SIDE_STORY/PARENT instead, so both are checked.
const SEASON_RELATION_TYPES = ['SEQUEL', 'SIDE_STORY', 'PARENT'];
function franchiseEdges(m){
  const edges = m.relations?.edges || [];
  const isTV = f => f === 'TV' || f === 'TV_SHORT';
  const prequel = edges.find(e => (e.relationType==='PREQUEL' || e.relationType==='PARENT') && isTV(e.node.format));
  const sequelLike = edges.filter(e => SEASON_RELATION_TYPES.includes(e.relationType) && isTV(e.node.format));
  const movieLike = edges.filter(e => SEASON_RELATION_TYPES.includes(e.relationType) && e.node.format === 'MOVIE');
  return { prequel, sequelLike, movieLike };
}
function gridHtml(items){
  return items.map(m => {
    if (state.settings.minScoreFilter && m.averageScore && m.averageScore < state.settings.minScoreFilter) return '';
    if (m.format === 'MOVIE' && state.settings.hideMoviesInBrowse) return '';
    if (m.format === 'TV' || m.format === 'TV_SHORT') {
      const { prequel, sequelLike, movieLike } = franchiseEdges(m);
      if (prequel) return ''; // a later season — reachable through its first season's series page instead
      const cached = franchiseCache.get(m.id);
      if (cached) return seriesCardHtml(m, cached.seasons.length, cached.movies.length);
      ensureFranchiseCount(m); // one-hop relations undercount 3+ season chains — walk the real chain in the background
      return seriesCardHtml(m, 1 + sequelLike.length, movieLike.length); // accurate-so-far placeholder meanwhile
    }
    return cardHtml(m);
  }).join('');
}

async function fetchBrowsePage(page){
  const b = state.browse;
  if (b.loading) return;
  b.loading = true; b.error = null; render();
  try {
    let data;
    if (b.mode === 'search') data = await alQuery(MEDIA_SEARCH_QUERY, { page, perPage: 24, search: b.search });
    else data = await alQuery(MEDIA_QUERY, { page, perPage: 24, genre: b.genre });
    b.items = page === 1 ? data.Page.media : [...b.items, ...data.Page.media];
    b.hasNext = data.Page.pageInfo.hasNextPage;
    b.page = page;
  } catch(e) { b.error = 'Could not reach AniList: ' + e.message; }
  b.loading = false; render(); setupBrowseObserver();
}
let browseObserver = null;
function setupBrowseObserver(){
  if (browseObserver) browseObserver.disconnect();
  const el = document.getElementById('browseSentinel');
  if (!el) return;
  browseObserver = new IntersectionObserver(entries => {
    const b = state.browse;
    if (entries[0].isIntersecting && b.hasNext && !b.loading) fetchBrowsePage(b.page + 1);
  }, { rootMargin:'500px' });
  browseObserver.observe(el);
}
let searchDebounce = null;
function onBrowseSearchInput(value){
  state.browse.search = value;
  clearTimeout(searchDebounce);
  if (!value.trim()) {
    state.browse.mode = 'pick'; state.browse.items = []; render();
    return;
  }
  searchDebounce = setTimeout(() => {
    state.browse.mode = 'search'; state.browse.page = 1; state.browse.hasNext = true;
    fetchBrowsePage(1);
  }, 450);
}

async function fetchSwipeMore(genre){
  const s = state.swipe;
  s.loading = true; s.error = null; render();
  try {
    let p;
    if (s.mode === 'random') {
      let tries = 0; p = Math.floor(Math.random()*8)+1;
      while (s.seenPages.has(p) && tries<8){ p = Math.floor(Math.random()*8)+1; tries++; }
      s.seenPages.add(p);
    } else {
      p = s.page; s.page++;
    }
    const data = await alQuery(MEDIA_QUERY, { page:p, perPage:20, genre });
    const eligible = data.Page.media.filter(m => {
      if (m.format !== 'TV' && m.format !== 'TV_SHORT') return true;
      return !franchiseEdges(m).prequel; // skip season 2+, its trailer belongs to its series page instead
    });
    const withT = eligible.filter(m => trailerEmbed(m.trailer));
    const rest = eligible.filter(m => !trailerEmbed(m.trailer));
    s.queue = [...s.queue, ...withT, ...rest];
  } catch(e){ s.error = 'Could not reach AniList: ' + e.message; }
  s.loading = false; render();
}

function quizVisibleQuestions(answers){
  return QUIZ_POOL.filter(q => !q.skip || !q.skip(answers));
}
function renderQuiz(){
  const qz = state.quiz;
  if (qz.done) {
    return `
      <div class="backbar"><button class="iconbtn" data-action="quizRestart">↺</button><span class="chip" style="background:var(--accent);color:#0a0a0a;">Your matches</span></div>
      ${qz.loading ? spinnerHtml() : (qz.results.length ? `<div class="grid">${gridHtml(qz.results)}</div>` : `<div class="empty">Nothing matched — try different answers.</div>`)}
    `;
  }
  const visible = quizVisibleQuestions(qz.answers);
  const q = visible[qz.step];
  if (!q) { finishQuiz(); return spinnerHtml(); }
  return `
    <div style="padding:18px 16px 6px;">
      <div class="section-title" style="margin:0 0 4px;">Question ${qz.step+1} of ~${visible.length}</div>
      <div style="height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;">
        <div style="height:100%;width:${Math.round(((qz.step)/visible.length)*100)}%;background:var(--accent);"></div>
      </div>
      <h2 style="font-size:18px;margin:0 0 16px;">${esc(q.q)}</h2>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${q.opts.map((o,i) => `<button class="btn ghost" style="text-align:left;padding:14px 16px;font-size:14px;" data-action="quizAnswer" data-qid="${q.id}" data-oidx="${i}">${esc(o.label)}</button>`).join('')}
      </div>
    </div>
  `;
}
function quizAnswer(qid, optIdx){
  const qz = state.quiz;
  const q = QUIZ_POOL.find(x => x.id === qid);
  const opt = q.opts[optIdx];
  qz.answers[qid] = { optIdx, ...opt };
  qz.step++;
  const visible = quizVisibleQuestions(qz.answers);
  if (qz.step >= visible.length) finishQuiz(); else render();
}
async function finishQuiz(){
  const qz = state.quiz;
  qz.done = true; qz.loading = true; render();
  const scores = {};
  let maxEpisodes = null, sort = 'POPULARITY_DESC', format = null, minScore = null;
  Object.values(qz.answers).forEach(a => {
    if (a.pts) Object.entries(a.pts).forEach(([g,w]) => { scores[g] = (scores[g]||0) + w; });
    if (a.meta) {
      if (a.meta.maxEpisodes) maxEpisodes = a.meta.maxEpisodes;
      if (a.meta.sort) sort = a.meta.sort;
      if (a.meta.format) format = a.meta.format;
      if (a.meta.minScore) minScore = a.meta.minScore;
    }
  });
  const topGenres = Object.entries(scores).sort((a,b) => b[1]-a[1]).slice(0,4).map(x=>x[0]);
  try {
    const query = `query($genres:[String],$perPage:Int,$sort:[MediaSort],$format:MediaFormat,$minScore:Int,$maxEp:Int){
      Page(page:1, perPage:$perPage){
        media(genre_in:$genres, sort:$sort, type:ANIME, isAdult:false, format:$format, averageScore_greater:$minScore, episodes_lesser:$maxEp){ ${MEDIA_FIELDS} }
      }
    }`;
    const data = await alQuery(query, {
      genres: topGenres.length ? topGenres : undefined,
      perPage: 24, sort: [sort], format: format || undefined,
      minScore: minScore || undefined, maxEp: maxEpisodes ? maxEpisodes + 1 : undefined,
    });
    qz.results = data.Page.media;
  } catch(e) { qz.results = []; }
  qz.loading = false; render();
}

const franchiseCache = new Map(); // rootId -> { seasons:[...], movies:[...] } (accurate, full chain)
const franchisePending = new Set();
async function walkFranchise(root){
  const isTV = f => f === 'TV' || f === 'TV_SHORT';
  const visited = new Map(); visited.set(root.id, root);
  const movies = new Map();
  const queue = [root.id];
  let guard = 0;
  while (queue.length && guard < 20) {
    guard++;
    const id = queue.shift();
    const data = await alQuery(SEASON_WALK_QUERY, { id });
    const edges = data.Media?.relations?.edges || [];
    edges.forEach(e => {
      if (!SEASON_RELATION_TYPES.includes(e.relationType)) return;
      const node = e.node;
      if (isTV(node.format)) {
        if (!visited.has(node.id)) { visited.set(node.id, node); queue.push(node.id); }
      } else if (node.format === 'MOVIE') {
        if (!movies.has(node.id)) movies.set(node.id, node);
      }
    });
  }
  const seasons = Array.from(visited.values()).sort((a,b) => {
    const ay = a.startDate?.year || a.seasonYear || 0, by = b.startDate?.year || b.seasonYear || 0;
    if (ay !== by) return ay - by;
    return (a.startDate?.month||0) - (b.startDate?.month||0);
  });
  return { seasons, movies: Array.from(movies.values()) };
}
// Grid cards show an approximate count instantly (from one-hop relations already in hand), then
// silently walk the real chain in the background and patch just that card's label in place —
// no full re-render, so it never resets your scroll position while browsing.
function ensureFranchiseCount(root){
  if (franchiseCache.has(root.id) || franchisePending.has(root.id)) return;
  franchisePending.add(root.id);
  walkFranchise(root).then(result => {
    franchiseCache.set(root.id, result);
    franchisePending.delete(root.id);
    const el = document.querySelector(`.card[data-series-id="${root.id}"] .formattag`);
    if (el) {
      let label = `${result.seasons.length} season${result.seasons.length>1?'s':''}`;
      if (result.movies.length) label += ` · ${result.movies.length} movie${result.movies.length>1?'s':''}`;
      el.textContent = label;
    }
  }).catch(() => { franchisePending.delete(root.id); });
}
async function loadSeriesChain(rootId, root){
  let result = franchiseCache.get(rootId);
  try {
    if (!result) { result = await walkFranchise(root); franchiseCache.set(rootId, result); }
  } catch(e){ result = { seasons:[root], movies:[] }; /* show whatever we found so far */ }
  const c = state.modalStack.find(x => x.type==='series' && x.data.id===rootId);
  if (c) { c.seasons = result.seasons; c.movies = result.movies; c.loading = false; render(); }
}

  try {
    const saved = await alSaveEntry(c.data.id, { status, progress: c.entry?.progress||0, score: c.entry?.score||0 });
    c.entry = saved;
    syncMylistCache(c.data, saved);
    render();

}
async function bumpProgress(delta){
  const c = curModal(); if (!c || c.type!=='anime' || !c.entry) return;
  const max = c.data.episodes || c.detail?.episodes || null;
  let next = (c.entry.progress||0) + delta;
  if (next < 0) next = 0;
  if (max && next > max) next = max;
  let status = c.entry.status;
  if (state.settings.autoCompleteOnLastEp && max && next >= max) status = 'COMPLETED';
  try {
    const saved = await alSaveEntry(c.data.id, { status, progress: next, score: c.entry.score||0 });
    c.entry = saved;
    syncMylistCache(c.data, saved);
    render();
  } catch(e){ alert('Could not update AniList: ' + e.message); }
}
async function setScore(score){
  const c = curModal(); if (!c || c.type!=='anime' || !c.entry) return;
  try {
    const saved = await alSaveEntry(c.data.id, { status: c.entry.status, progress: c.entry.progress||0, score });
    c.entry = saved;
    syncMylistCache(c.data, saved);
    render();
  } catch(e){ alert('Could not update AniList: ' + e.message); }
}
async function removeCurrentEntry(){
  const c = curModal(); if (!c || c.type!=='anime' || !c.entry) return;
  try {
    await alDeleteEntry(c.entry.id);
    for (const k in state.mylist.byStatus) state.mylist.byStatus[k] = state.mylist.byStatus[k].filter(x=>x.id!==c.data.id);
    c.entry = null;
    render();
  } catch(e){ alert('Could not update AniList: ' + e.message); }
}
function syncMylistCache(media, entry){
  for (const k in state.mylist.byStatus) state.mylist.byStatus[k] = state.mylist.byStatus[k].filter(x=>x.id!==media.id);
  if (!state.mylist.byStatus[entry.status]) state.mylist.byStatus[entry.status] = [];
  state.mylist.byStatus[entry.status].push({ ...media, _entry: entry });
}

/* ============================== EVENT DELEGATION ============================== */
function bindDynamic(){
  if (state.tab === 'browse' && state.browse.mode !== 'pick') setupBrowseObserver();
}
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;

  if (action === 'pickBrowseGenre') {
    state.browse = { mode:'genre', genre: t.dataset.genre, search:'', items:[], page:1, hasNext:true, loading:false, error:null };
    render(); fetchBrowsePage(1);
  }
  else if (action === 'backBrowse') { browseObserver && browseObserver.disconnect(); state.browse = { mode:'pick', genre:null, search:'', items:[], page:1, hasNext:true, loading:false, error:null }; render(); }
  else if (action === 'clearSearch') { state.browse.search=''; state.browse.mode='pick'; state.browse.items=[]; render(); }
  else if (action === 'openMedia') { openAnimeModal(JSON.parse(t.dataset.mediajson)); }
  else if (action === 'openSeries') { openSeriesModal(JSON.parse(t.dataset.mediajson)); }
  else if (action === 'openPerson') { openPersonModal(Number(t.dataset.id), t.dataset.name); }
  else if (action === 'openStudio') { openStudioModal(Number(t.dataset.id), t.dataset.name); }
  else if (action === 'modalBack') { popModal(); }
  else if (action === 'closeModal') { closeAllModals(); }
  else if (action === 'closeModalBg') { if (ev.target.classList.contains('modal-wrap')) closeAllModals(); }
  else if (action === 'playModal') {
    const c = curModal();
    if (state.settings.openTrailerNewTab) { window.open(trailerWatch(c.data.trailer), '_blank', 'noopener'); }
    else {
      const wrap = document.getElementById('videoWrap');
      wrap.innerHTML = `<iframe src="${trailerEmbed(c.data.trailer)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    }
  }
  else if (action === 'modalLike') { const c = curModal(); if (c) { await doLike(c.data); renderModal(); } }
  else if (action === 'setStatus') { await setEntryStatus(t.dataset.status); }
  else if (action === 'progUp') { await bumpProgress(1); }
  else if (action === 'progDown') { await bumpProgress(-1); }
  else if (action === 'setScoreStar') { await setScore(Number(t.dataset.val)); }
  else if (action === 'saveScoreInput') {
    const input = document.getElementById('scoreInput') || document.querySelector('[data-role="scoreInput"]');
    if (input) await setScore(parseFloat(input.value) || 0);
  }
  else if (action === 'removeEntry') { await removeCurrentEntry(); }
  else if (action === 'submitReview') {
    const c = curModal(); if (!c || c.type!=='anime') return;
    const summary = document.getElementById('reviewSummary').value.trim();
    const body = document.getElementById('reviewBody').value.trim();
    const score = Number(document.getElementById('reviewScore').value) || 0;
    const statusEl = document.getElementById('reviewStatus');
    if (body.length < 300) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Review body needs to be at least 300 characters.'; return; }
    if (!summary) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Add a short summary first.'; return; }
    statusEl.style.color = 'var(--sub)'; statusEl.textContent = 'Submitting…';
    try {
      await alSaveReview(c.data.id, { summary, body, score });
      statusEl.style.color = 'var(--green)'; statusEl.textContent = 'Review submitted to AniList ✓';
    } catch(e) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Failed: ' + e.message; }
  }

  else if (action === 'pickSwipeGenre') {
    state.swipe = { genre: t.dataset.genre, mode: state.swipe.mode, queue:[], idx:0, page:1, playing:false, loading:false, error:null, seenPages:new Set() };
    render(); fetchSwipeMore(t.dataset.genre);
  }
  else if (action === 'backSwipe') { state.swipe = { genre:null, mode: state.swipe.mode, queue:[], idx:0, page:1, playing:false, loading:false, error:null, seenPages:new Set() }; render(); }
  else if (action === 'setDiscoverMode') { state.swipe.mode = t.dataset.mode; render(); }
  else if (action === 'playSwipe') {
    const cur = state.swipe.queue[state.swipe.idx];
    if (state.settings.openTrailerNewTab) { window.open(trailerWatch(cur.trailer), '_blank', 'noopener'); }
    else { state.swipe.playing = true; render(); }
  }
  else if (action === 'swipeSkip') { advanceSwipe(); }
  else if (action === 'swipeLike') { const c = state.swipe.queue[state.swipe.idx]; if (c) await doLike(c); advanceSwipe(); }
  else if (action === 'swipePlan') {
    const c = state.swipe.queue[state.swipe.idx];
    if (c) {
      if (!state.anilist) { alert('Connect AniList in Settings first.'); }
      else { try { const saved = await alSaveEntry(c.id, { status:'PLANNING', progress:0, score:0 }); syncMylistCache(c, saved); } catch(e){ alert('Could not update AniList: ' + e.message); } }
    }
  }

  else if (action === 'myTab') { state.mylist.tab = t.dataset.key; render(); }
  else if (action === 'quizAnswer') { quizAnswer(t.dataset.qid, Number(t.dataset.oidx)); }
  else if (action === 'quizRestart') { state.quiz = { step:0, answers:{}, done:false, loading:false, results:[] }; render(); }

  else if (action === 'connectAL') {
    const cid = document.getElementById('alCidInput').value.trim();
    if (!cid) return alert('Enter your AniList Client ID first.');
    LS.set('al_client_id', cid);
    location.href = alAuthUrl(cid);
  }
  else if (action === 'disconnectAL') { state.anilist = null; LS.set('al_auth', null); state.mylist.byStatus = { CURRENT:[], PLANNING:[], COMPLETED:[], PAUSED:[], DROPPED:[], REPEATING:[] }; myListLoaded=false; render(); }
  else if (action === 'setDensity') { state.settings.gridDensity = t.dataset.density; applyGridDensity(state.settings.gridDensity); saveSettings(); render(); }
  else if (action === 'resetLiked') { state.local.liked = []; persistPrefs(); render(); }
  else if (action === 'toggleAutoplay') { state.settings.autoplayTrailer = t.checked; saveSettings(); render(); }
  else if (action === 'toggleNewTab') { state.settings.openTrailerNewTab = t.checked; saveSettings(); render(); }
  else if (action === 'toggleReduceMotion') { state.settings.reduceMotion = t.checked; applyReduceMotion(t.checked); saveSettings(); render(); }
  else if (action === 'setDefaultDiscoverMode') { state.settings.defaultDiscoverMode = t.dataset.mode; saveSettings(); render(); }
  else if (action === 'setDefaultMyListTab') { state.settings.defaultMyListTab = t.dataset.key; saveSettings(); render(); }
  else if (action === 'toggleHideMovies') { state.settings.hideMoviesInBrowse = t.checked; saveSettings(); render(); }
  else if (action === 'saveMinScore') {
    const v = Math.max(0, Math.min(100, Number(document.getElementById('minScoreInput').value) || 0));
    state.settings.minScoreFilter = v; saveSettings(); render();
  }
  else if (action === 'toggleAutoComplete') { state.settings.autoCompleteOnLastEp = t.checked; saveSettings(); render(); }
  else if (action === 'exportData') {
    const blob = new Blob([JSON.stringify({ settings: state.settings, liked: state.local.liked, theme: state.theme }, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'anibrowse-data.json'; a.click();
    URL.revokeObjectURL(a.href);
  }
  else if (action === 'importData') { document.getElementById('importFileInput').click(); }
  else if (action === 'resetSettings') {
    if (confirm('Reset all settings to their defaults?')) {
      state.settings = { autoplayTrailer:false, gridDensity:'comfortable', showScores:true, openTrailerNewTab:false, reduceMotion:false, defaultDiscoverMode:'random', hideMoviesInBrowse:false, minScoreFilter:0, autoCompleteOnLastEp:true, defaultMyListTab:'CURRENT' };
      saveSettings(); applyGridDensity(state.settings.gridDensity); applyReduceMotion(false); render();
    }
  }

  else if (action === 'setMode') { applyTheme({ family: (CATPPUCCIN[state.theme.family] ? 'orange' : state.theme.family), mode: t.dataset.mode }); render(); }
  else if (action === 'setFamily') { applyTheme({ family: t.dataset.family, mode: state.theme.mode === 'light' ? 'light' : 'dark' }); render(); }
  else if (action === 'setCatppuccin') { applyTheme({ family: t.dataset.family, mode: t.dataset.family === 'catppuccin-latte' ? 'light' : 'dark' }); render(); }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'importFileInput' && ev.target.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed.settings) { state.settings = { ...state.settings, ...parsed.settings }; saveSettings(); applyGridDensity(state.settings.gridDensity); applyReduceMotion(state.settings.reduceMotion); }
        if (Array.isArray(parsed.liked)) { state.local.liked = parsed.liked; persistPrefs(); }
        if (parsed.theme) { applyTheme(parsed.theme); }
        render();
        alert('Data imported.');
      } catch(e) { alert('That file doesn\u2019t look like valid AniBrowse data.'); }
    };
    reader.readAsText(ev.target.files[0]);
  }
});
document.addEventListener('input', (ev) => {
  if (ev.target.dataset.role === 'browseSearch') onBrowseSearchInput(ev.target.value);
  if (ev.target.id === 'reviewBody') {
    const n = ev.target.value.trim().length;
    const el = document.getElementById('reviewCharcount');
    if (el) { el.textContent = `${n} / 300 minimum`; el.classList.toggle('bad', n < 300); }
  }
  if (ev.target.classList.contains('customswatch')) {
    const family = ev.target.dataset.family;
    LS.set(family === 'custom-expressive' ? 'custom_expressive_color' : 'custom_fluent_color', ev.target.value);
    applyTheme({ family, mode: state.theme.mode === 'light' ? 'light' : 'dark', customColor: ev.target.value });
    render();
  }
});
function advanceSwipe(){ state.swipe.playing = false; state.swipe.idx++; if (state.swipe.queue.length - state.swipe.idx < 5 && state.swipe.genre) fetchSwipeMore(state.swipe.genre); render(); }

document.getElementById('tabs').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-tab]');
  if (!b) return;
  state.tab = b.dataset.tab;
  if (state.tab === 'mylist') myListLoaded = false;
  render();
});

/* ============================== INIT ============================== */
(async function init(){
  try {
    const data = await alQuery(`query{ GenreCollection }`, {});
    state.genres = (data.GenreCollection || []).filter(g => g !== 'Hentai');
  } catch(e) {
    state.genresError = 'Could not load categories from AniList: ' + e.message;
  }
  if (state.anilist?.token && !state.anilist.user) {
    try { const u = await alFetchViewer(); state.anilist.user = u; state.anilist.scoreFormat = u.mediaListOptions?.scoreFormat || 'POINT_10'; LS.set('al_auth', state.anilist); } catch(e){}
  } else if (state.anilist?.token && !state.anilist.scoreFormat) {
    try { const u = await alFetchViewer(); state.anilist.scoreFormat = u.mediaListOptions?.scoreFormat || 'POINT_10'; LS.set('al_auth', state.anilist); } catch(e){}
  }
  render();
})();
</script>
